name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apps:
    name: Build Apps (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os: 'windows'
            arch: 'x64'
          - platform: 'macos-latest'
            os: 'macos'
            arch: 'universal'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            os: 'linux'
            arch: 'x64'
            args: '--bundles appimage,deb'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Application
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args || '' }}

      - name: Collect installer artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist-artifacts
          copied=0
          copy_one() {
            if [ -e "$1" ]; then
              mkdir -p "dist-artifacts/$(dirname "$1")"
              cp -a "$1" "dist-artifacts/$1"
              copied=1
            fi
          }
          case "${{ matrix.os }}" in
            linux)
              for f in target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage; do
                copy_one "$f"
              done
              ;;
            windows)
              for f in target/release/bundle/msi/*.msi target/release/bundle/nsis/*.exe; do
                copy_one "$f"
              done
              ;;
            macos)
              for f in target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
                copy_one "$f"
              done
              for f in target/universal-apple-darwin/release/bundle/macos/*.app; do
                copy_one "$f"
              done
              ;;
            *)
              echo "unknown os ${{ matrix.os }}" >&2
              exit 1
              ;;
          esac
          if [ "$copied" -ne 1 ]; then
            echo "no installer artifacts found" >&2
            find target -path '*/bundle/*' -print | head -200 >&2 || true
            exit 1
          fi

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tongyun-git-${{ matrix.os }}-${{ matrix.arch }}
          path: dist-artifacts/**
          if-no-files-found: error
          retention-days: 7
