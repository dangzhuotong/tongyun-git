name: Release

# Tag v* publishes a GitHub Release plus updater latest.json.
# workflow_dispatch builds installers and uploads Actions artifacts only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-apps:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os: windows
            arch: x64
            args: ""
          - platform: macos-latest
            os: macos
            arch: universal
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            os: linux
            arch: x64
            args: "--bundles appimage,deb"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'tongyun-git v__VERSION__' || '' }}
          # 非 tag 触发时 tagName/releaseName 为空，tauri-action 只构建不建 Release
          releaseBody: |
            tongyun-git v__VERSION__

            下载指引：
            - Windows 选 *_x64-setup.exe（推荐）或 .msi
            - macOS 选 *_universal.dmg（Apple Silicon 与 Intel 通用）
            - Linux 选 .AppImage 或 .deb

            已安装带更新器的版本可在设置或关于里点「检查更新」。启动约 3 秒后也会静默检查，有新版会提示。

            ### macOS 首次打开
            安装包没有 Apple 签名和公证，所以 macOS 首次打开会提示无法验证开发者。三种解决办法：
            1. 系统设置 → 隐私与安全性 → 往下找到提示，点「仍要打开」；
            2. 在「应用程序」里右键点 App，选「打开」，再确认一次；
            3. 终端执行：`xattr -dr com.apple.quarantine /Applications/tongyun-git.app`

            已经装上的 App 用「检查更新」换的是 minisign 签过的包，不受这次隔离提示影响。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args || '' }}
          # 仅 tag 发版时写入 latest.json；workflow_dispatch 只构建、不碰 Release
          includeUpdaterJson: ${{ startsWith(github.ref, 'refs/tags/') }}
          updaterJsonPreferNsis: true

      - name: Collect installer artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist-artifacts
          copied=0
          copy_one() {
            if [ -e "$1" ]; then
              mkdir -p "dist-artifacts/$(dirname "$1")"
              cp -a "$1" "dist-artifacts/$1"
              copied=1
            fi
          }
          case "${{ matrix.os }}" in
            linux)
              for f in target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage; do
                copy_one "$f"
              done
              ;;
            windows)
              for f in target/release/bundle/msi/*.msi target/release/bundle/nsis/*.exe; do
                copy_one "$f"
              done
              ;;
            macos)
              for f in target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
                copy_one "$f"
              done
              for f in target/universal-apple-darwin/release/bundle/macos/*.app; do
                copy_one "$f"
              done
              ;;
            *)
              echo "unknown os ${{ matrix.os }}" >&2
              exit 1
              ;;
          esac
          if [ "$copied" -ne 1 ]; then
            echo "no installer artifacts found" >&2
            find target -path '*/bundle/*' -print | head -200 >&2 || true
            exit 1
          fi

      - name: Upload bundle artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: tongyun-git-${{ matrix.os }}-${{ matrix.arch }}
          path: dist-artifacts/**
          if-no-files-found: error
          retention-days: 7
