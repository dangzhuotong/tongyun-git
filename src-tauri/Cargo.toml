[package]
name = "tongyun-git"
version = "0.0.0"
description = "tongyun-git desktop host"
edition.workspace = true

[lib]
name = "tongyun_git_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tg-core = { path = "../crates/tg-core" }
rfd = "0.15"
